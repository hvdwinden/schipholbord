plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.schipholbord'
    compileSdk 36

    defaultConfig {
        applicationId 'nl.schipholbord'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// De webapp (../../index.html) wordt bij elke build als asset meegenomen
tasks.register('copyWeb', Copy) {
    from '../../index.html'
    into 'src/main/assets'
}
preBuild.dependsOn 'copyWeb'
